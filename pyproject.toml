[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalableImageTransformations"
version = "1.0.0"
description = "My Python package related to scaling image transformations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Prakhar Gandhi", email = "gprakhar0@gmail.com"}
]
requires-python = ">=3.9"

dependencies = [
    "mpire",
    "albumentationsx"
]


classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]